[build]
  command = "npm run build"
  publish = ".next"
  # Skip the (credit-costing) production build when nothing the app is built
  # from changed, e.g. docs, ROADMAP.md, CLAUDE.md or supabase/migrations.
  # Exit 0 = skip. Add [skip netlify] to a commit message to force a skip.
  # When there is no previous build to compare to, CACHED_COMMIT_REF equals
  # COMMIT_REF; the first test then fails, so the build runs.
  ignore = "[ \"$CACHED_COMMIT_REF\" != \"$COMMIT_REF\" ] && git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- src public package.json package-lock.json next.config.ts tailwind.config.ts postcss.config.mjs tsconfig.json components.json patches"

[build.environment]
  NODE_ENV = "production"
  NPM_CONFIG_PRODUCTION = "false"
  SECRETS_SCAN_OMIT_KEYS = "EMAIL_HOST,EMAIL_PASS,EMAIL_PORT,NEXT_PUBLIC_SUPABASE_ANON_KEY,NEXT_PUBLIC_SUPABASE_URL,STRAVA_CLIENT_SECRET,SUPABASE_SERVICE_ROLE_KEY,WEATHERAPI_KEY"

[[plugins]]
  package = "@netlify/plugin-nextjs"
